apis:
- aid: lastline:analyst-api
  name: Lastline Analyst API
  description: 'Web API for submitting files (PE, PDF, Office documents, Flash, Java applets, Android
    applications, archives) and URLs to the Lastline analysis cloud for high-resolution behavioral malware
    analysis, then retrieving task results, analysis reports, behavior activities, generated artifacts
    and network indicators of compromise. The API is asynchronous: submissions return a task UUID which
    is later resolved through get_completed() and get_result(). Responses are JSON or XML selected by
    a URL extension. The reference documentation remains live at analysis.lastline.com.'
