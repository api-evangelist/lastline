aid: lastline
name: Lastline
description: 'Lastline was a Santa Barbara, California cybersecurity company founded in 2011, building
  high-resolution malware analysis and network detection and response (NDR) technology based on full-system
  emulation sandboxing. Its developer-facing surface is the Lastline Analyst API (marketed in the company''s
  earliest years as the Previct Analyst API), an asynchronous web API for submitting files and URLs to
  the Lastline analysis cloud and retrieving detailed behavioral analysis reports, indicators of compromise
  and analysis artifacts. Lastline was acquired by VMware in 2020 and the technology was folded into VMware
  NSX Network Detection and Response; VMware was subsequently acquired by Broadcom. The lastline.com marketing
  site is retired and no longer answers HTTP, but the customer portal at user.lastline.com is live and
  branded "NSX - Network Detection and Response" behind a Broadcom Inc. TLS certificate, and the full
  Analyst API reference plus its first-party Python client downloads remain served. This profile captures
  that surviving API surface from the live first-party documentation, together with probes recording
  what is no longer published.'
