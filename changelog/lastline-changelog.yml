entries:
- date: '2016-10-28'
  title: Move API client shell to dedicated script.
  breaking: true
  additions: false
  highlights:
  - The API client shell moved to analysis_apiclient_shell.py, which provides easier access to the
    helper modules provided by the API client module.
- date: '2016-10-05'
  title: Stop download of full report details during submission.
  breaking: true
  additions: false
  highlights:
  - Submission functions (submit_file, submit_file_hash, submit_url) now default to
    full_report_score=ANALYSIS_API_NO_REPORT_DETAILS (the constant for -1), which disables automatic
    download of the full detailed analysis report when a cached result is immediately available.
  - To access the full analysis report, call get_result() with the task_uuid returned as part of the
    submission result.
